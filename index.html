<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Wrapped 2024</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
            background: repeating-linear-gradient(
                45deg,
                #1a1a1a,
                #1a1a1a 10px,
                #2a2a2a 10px,
                #2a2a2a 20px
            );
            overflow: hidden;
        }
        .wrapped-text {
            color: #003366;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            transform: rotate(-8deg);
            text-shadow: 2px 2px 0px white, 4px 4px 0px #003366;
        }
        .card-border {
            border: 6px solid #003366;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.3);
        }
        .stat-box {
            background: white;
            border: 4px solid #003366;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
        }
        .input-box {
            border: 3px solid #003366;
            font-weight: 700;
        }
        .btn-wrapped {
            background: #003366;
            border: 3px solid #003366;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .btn-wrapped:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
        }
        .number-display {
            font-family: 'Impact', sans-serif;
            font-weight: 900;
            color: #003366;
        }
        .sparkle {
            display: inline-block;
            font-size: 2.5rem;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .animate-scale-in {
            animation: scaleIn 0.8s ease-out forwards;
        }
        
        .animate-slide-in-left {
            animation: slideInLeft 0.5s ease-out forwards;
        }
        
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation-delay: 0.5s; opacity: 0; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">
    
    <div id="inputScreen" class="w-full max-w-4xl">
        <div class="bg-white card-border rounded-3xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="text-center mb-6">
                <h1 class="text-4xl md:text-5xl wrapped-text mb-4">Wrapped</h1>
                <h2 class="text-2xl md:text-3xl font-black text-gray-800 uppercase mb-2">2024</h2>
                <p class="text-lg font-bold text-gray-700 uppercase">Enter Your Top 5 Groups</p>
            </div>

            <div class="space-y-3 mb-6" id="chatInputs"></div>

            <button onclick="generateWrapped()" class="w-full btn-wrapped text-white py-4 rounded-xl text-lg transition-all">
                Generate My Wrapped ✨
            </button>
        </div>
    </div>

    <div id="wrappedScreen" class="hidden w-full max-w-5xl h-[90vh]">
        <div class="bg-white card-border rounded-3xl p-6 md:p-10 h-full flex flex-col justify-between">
            <div class="flex-1 flex flex-col justify-center">
                <div class="text-center mb-6">
                    <h1 class="text-3xl md:text-5xl wrapped-text mb-3 animate-fade-in-up">Wrapped</h1>
                    <h2 id="slideTitle" class="text-2xl md:text-4xl font-black text-gray-800 uppercase mb-1 animate-fade-in-up stagger-1"></h2>
                    <p id="slideSubtitle" class="text-lg md:text-xl font-bold text-gray-600 uppercase animate-fade-in-up stagger-2"></p>
                </div>
                <div id="slideContent" class="overflow-y-auto max-h-[50vh]"></div>
            </div>

            <div class="flex justify-between items-center mt-6">
                <button onclick="previousSlide()" id="backBtn" class="px-6 py-2 bg-gray-200 border-3 border-gray-400 rounded-xl font-black uppercase text-sm hover:bg-gray-300 transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                    Back
                </button>
                <div id="dots" class="flex gap-2"></div>
                <button onclick="nextSlide()" id="nextBtn" class="px-6 py-2 btn-wrapped text-white rounded-xl transition-all text-sm">
                    Next
                </button>
            </div>
        </div>
    </div>

    <script>
        var chats = [];
        var currentSlide = 0;
        var totalHours = 0;
        var totalMessages = 0;
        var topChat = {};

        function initInputs() {
            var container = document.getElementById('chatInputs');
            for (var i = 0; i < 5; i++) {
                var div = document.createElement('div');
                div.className = 'flex gap-3';
                div.innerHTML = '<div class="w-12 h-12 bg-blue-900 rounded-xl flex items-center justify-center text-white font-black text-xl border-3 border-blue-950">' + (i + 1) + '</div>' +
                    '<input type="text" id="name' + i + '" placeholder="GROUP NAME" class="flex-1 px-4 py-3 input-box rounded-xl text-gray-800 uppercase font-bold placeholder-gray-400 focus:outline-none text-sm" />' +
                    '<input type="number" id="hours' + i + '" placeholder="HRS" class="w-24 px-4 py-3 input-box rounded-xl text-gray-800 font-black text-center focus:outline-none text-sm" />';
                container.appendChild(div);
            }
        }

        function generateWrapped() {
            chats = [];
            for (var i = 0; i < 5; i++) {
                var name = document.getElementById('name' + i).value;
                var hours = parseFloat(document.getElementById('hours' + i).value) || 0;
                if (name && hours > 0) {
                    chats.push({ name: name, hours: hours });
                }
            }

            if (chats.length === 0) {
                alert('Please enter at least one group with hours!');
                return;
            }

            totalHours = 0;
            for (var i = 0; i < chats.length; i++) {
                totalHours += chats[i].hours;
            }
            
            totalMessages = Math.round(totalHours * 42);
            topChat = chats[0];
            for (var i = 1; i < chats.length; i++) {
                if (chats[i].hours > topChat.hours) {
                    topChat = chats[i];
                }
            }

            document.getElementById('inputScreen').classList.add('hidden');
            document.getElementById('wrappedScreen').classList.remove('hidden');
            
            createDots();
            showSlide(0);
        }

        function createDots() {
            var dotsContainer = document.getElementById('dots');
            dotsContainer.innerHTML = '';
            for (var i = 0; i < 5; i++) {
                var dot = document.createElement('div');
                dot.className = i === 0 ? 'w-3 h-3 rounded-full bg-blue-900 border-2 border-blue-950' : 'w-3 h-3 rounded-full bg-gray-300 border-2 border-gray-400';
                dotsContainer.appendChild(dot);
            }
        }

        function updateDots() {
            var dots = document.getElementById('dots').children;
            for (var i = 0; i < dots.length; i++) {
                dots[i].className = i === currentSlide 
                    ? 'w-3 h-3 rounded-full bg-blue-900 border-2 border-blue-950' 
                    : 'w-3 h-3 rounded-full bg-gray-300 border-2 border-gray-400';
            }
        }

        function showSlide(index) {
            currentSlide = index;
            updateDots();

            var backBtn = document.getElementById('backBtn');
            var nextBtn = document.getElementById('nextBtn');
            
            backBtn.disabled = currentSlide === 0;
            
            if (currentSlide === 4) {
                nextBtn.textContent = 'Start Over';
            } else {
                nextBtn.textContent = 'Next';
            }

            var slides = getSlides();
            var titleEl = document.getElementById('slideTitle');
            var subtitleEl = document.getElementById('slideSubtitle');
            var contentEl = document.getElementById('slideContent');
            
            titleEl.className = 'text-2xl md:text-4xl font-black text-gray-800 uppercase mb-1';
            subtitleEl.className = 'text-lg md:text-xl font-bold text-gray-600 uppercase';
            
            setTimeout(function() {
                titleEl.textContent = slides[index].title;
                subtitleEl.textContent = slides[index].subtitle;
                contentEl.innerHTML = slides[index].content;
                
                titleEl.className = 'text-2xl md:text-4xl font-black text-gray-800 uppercase mb-1 animate-fade-in-up';
                subtitleEl.className = 'text-lg md:text-xl font-bold text-gray-600 uppercase animate-fade-in-up stagger-1';
            }, 50);
        }

        function getSlides() {
            var topChatPercentage = totalHours > 0 ? Math.round((topChat.hours / totalHours) * 100) : 0;
            var totalMinutes = Math.round(totalHours * 60);
            
            var chatsHtml = '';
            for (var i = 0; i < chats.length; i++) {
                chatsHtml += '<div class="stat-box rounded-xl p-4 mb-3 animate-slide-in-left stagger-' + (i + 1) + '">' +
                    '<div class="flex justify-between items-center">' +
                    '<div class="flex items-center gap-3">' +
                    '<span class="text-2xl font-black text-gray-400">#' + (i + 1) + '</span>' +
                    '<span class="text-lg font-black text-gray-800 uppercase">' + chats[i].name + '</span>' +
                    '</div>' +
                    '<span class="text-2xl font-black number-display">' + Math.round(chats[i].hours) + 'H</span>' +
                    '</div>' +
                    '</div>';
            }
            
            return [
                {
                    title: "Your Year",
                    subtitle: "In Messages",
                    content: '<div class="text-center space-y-6">' +
                        '<div class="sparkle animate-scale-in">💬</div>' +
                        '<div class="stat-box rounded-3xl p-8 inline-block animate-scale-in stagger-1">' +
                        '<p class="text-xl font-black text-gray-600 uppercase mb-2">Total Hours</p>' +
                        '<p class="text-6xl md:text-7xl font-black number-display">' + Math.round(totalHours) + '</p>' +
                        '</div>' +
                        '<p class="text-lg font-bold text-gray-700 uppercase animate-fade-in-up stagger-2">Hours Connecting On Campus</p>' +
                        '</div>'
                },
                {
                    title: "Top Groups",
                    subtitle: "Your Most Active",
                    content: '<div class="max-w-2xl mx-auto">' + chatsHtml + '</div>'
                },
                {
                    title: "Number 1",
                    subtitle: topChat.name.toUpperCase(),
                    content: '<div class="text-center space-y-6">' +
                        '<div class="sparkle animate-scale-in">👑</div>' +
                        '<div class="stat-box rounded-3xl p-8 inline-block mb-4 animate-scale-in stagger-1">' +
                        '<p class="text-6xl md:text-7xl font-black number-display mb-2">' + Math.round(topChat.hours) + '</p>' +
                        '<p class="text-2xl font-black text-gray-600 uppercase">Hours</p>' +
                        '</div>' +
                        '<div class="grid grid-cols-2 gap-4 max-w-xl mx-auto">' +
                        '<div class="stat-box rounded-xl p-4 animate-fade-in-up stagger-2">' +
                        '<p class="text-4xl font-black number-display">' + topChatPercentage + '%</p>' +
                        '<p class="text-sm font-bold text-gray-600 uppercase mt-1">Of Your Time</p>' +
                        '</div>' +
                        '<div class="stat-box rounded-xl p-4 animate-fade-in-up stagger-3">' +
                        '<p class="text-4xl font-black number-display">' + Math.floor(topChat.hours / 2) + '</p>' +
                        '<p class="text-sm font-bold text-gray-600 uppercase mt-1">Movies Worth</p>' +
                        '</div>' +
                        '</div>' +
                        '</div>'
                },
                {
                    title: "By The Numbers",
                    subtitle: "Your Stats",
                    content: '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-3xl mx-auto">' +
                        '<div class="stat-box rounded-xl p-6 text-center animate-scale-in stagger-1">' +
                        '<div class="text-4xl mb-2">💬</div>' +
                        '<p class="text-3xl font-black number-display mb-1">~' + totalMessages.toLocaleString() + '</p>' +
                        '<p class="text-sm font-bold text-gray-600 uppercase">Messages</p>' +
                        '</div>' +
                        '<div class="stat-box rounded-xl p-6 text-center animate-scale-in stagger-2">' +
                        '<div class="text-4xl mb-2">⏰</div>' +
                        '<p class="text-3xl font-black number-display mb-1">' + totalMinutes.toLocaleString() + '</p>' +
                        '<p class="text-sm font-bold text-gray-600 uppercase">Minutes Yapped</p>' +
                        '</div>' +
                        '<div class="stat-box rounded-xl p-6 text-center animate-scale-in stagger-3">' +
                        '<div class="text-4xl mb-2">🌙</div>' +
                        '<p class="text-3xl font-black number-display mb-1">9PM-1AM</p>' +
                        '<p class="text-sm font-bold text-gray-600 uppercase">Peak Hours</p>' +
                        '</div>' +
                        '</div>'
                },
                {
                    title: "Social Butterfly",
                    subtitle: "Achievement Unlocked",
                    content: '<div class="text-center space-y-6">' +
                        '<div class="sparkle animate-scale-in">🦋</div>' +
                        '<div class="stat-box rounded-3xl p-8 max-w-xl mx-auto animate-scale-in stagger-1">' +
                        '<p class="text-2xl font-black text-gray-800 uppercase mb-4">You Did It!</p>' +
                        '<div class="space-y-3 text-left">' +
                        '<p class="text-lg font-bold text-gray-700">✓ <span class="number-display text-xl">' + Math.round(totalHours) + '</span> HOURS CONNECTED</p>' +
                        '<p class="text-lg font-bold text-gray-700">✓ <span class="number-display text-xl">~' + totalMessages.toLocaleString() + '</span> MESSAGES SENT</p>' +
                        '<p class="text-lg font-bold text-gray-700">✓ <span class="number-display text-xl">' + chats.length + '</span> GROUPS ACTIVE</p>' +
                        '</div>' +
                        '</div>' +
                        '<p class="text-lg font-bold text-gray-600 uppercase animate-fade-in-up stagger-2">Keep The Vibes Going! ✨</p>' +
                        '</div>'
                }
            ];
        }

        function previousSlide() {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        }

        function nextSlide() {
            if (currentSlide < 4) {
                showSlide(currentSlide + 1);
            } else {
                document.getElementById('wrappedScreen').classList.add('hidden');
                document.getElementById('inputScreen').classList.remove('hidden');
                currentSlide = 0;
                for (var i = 0; i < 5; i++) {
                    document.getElementById('name' + i).value = '';
                    document.getElementById('hours' + i).value = '';
                }
            }
        }

        initInputs();
    </script>
</body>
</html>
